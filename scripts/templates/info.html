{% load bootstrap_icons %}

<span class="stat-votes">{% bs_icon 'hand-thumbs-up-fill' %}{{ record.score }}</span>

<span class="stat-downloads">{% bs_icon 'download' %}{{ record.script.num_downloads }}</span>
