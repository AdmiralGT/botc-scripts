{% load bootstrap_icons %}

<span style="color:red" title="Votes"><span class="sr-only">Votes: </span>{% bs_icon 'hand-thumbs-up-fill' %}{{ record.score }}</span>
<span style="color:#ffc000" title="Favourites"><span class="sr-only">Favourites: </span>{% bs_icon 'star-fill' %}{{ record.num_favs }}</span>
<span style="color:green" title="Comments"><span class="sr-only">Comments: </span>{% bs_icon 'pen-fill' %}{{ record.num_comments }}</span>
<span style="color:blue" title="Downloads"><span class="sr-only">Downloads: </span>{% bs_icon 'download' %}{{ record.script.num_downloads }}</span>
