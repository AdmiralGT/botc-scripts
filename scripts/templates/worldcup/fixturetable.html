<div class="table-striped table-responsive-wrapper w-100">
    <table class="table worldcup-table">
        <caption class="sr-only">{{ title }} fixtures</caption>
        <thead>
            <tr>
                <th scope="col" class="text-center">Script 1</th>
                <th scope="col"><span class="sr-only">Versus</span></th>
                <th scope="col" class="text-center">Script 2</th>
                <th scope="col" class="text-center">VoD</th>
                <th scope="col" class="text-center">Vote</th>
            </tr>
        </thead>
        <tbody>
            {% for entry in round %}
                {% include "worldcup/fixturerow.html" %}
            {% empty %}
                <tr>
                    <td colspan="5" class="text-center text-muted">No fixtures yet.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
