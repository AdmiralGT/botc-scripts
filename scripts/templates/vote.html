{% load botc_script_tags bootstrap_icons %}

{% user_voted_icon record as user_voted_icon %}
<form class="d-inline-block m-0" action="{% url 'vote' record.script.pk %}" method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="btn {% user_voted record %}" aria-label="Toggle script vote">{% bs_icon user_voted_icon %}</button>
</form>
